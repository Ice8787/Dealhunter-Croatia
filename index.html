<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Croatia Grocery Hunter</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#f5f7f8;color:#182126}header{background:#0f766e;color:#fff;padding:20px}.wrap{max-width:1100px;margin:auto;padding:20px}h1{margin:0}.card{background:#fff;border:1px solid #dde3e7;border-radius:16px;padding:16px;margin-bottom:16px}.controls{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #d7dde2}button{cursor:pointer;background:#0f766e;color:#fff;border:none}.grid{display:grid;grid-template-columns:1fr 320px;gap:16px}.deal{display:grid;grid-template-columns:1fr auto;gap:12px;padding:14px 0;border-bottom:1px solid #e5e9ec}.deal:last-child{border-bottom:none}.muted{color:#6b7680;font-size:13px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{background:#eef2f4;border-radius:999px;padding:4px 8px;font-size:12px}.good{background:#dcfce7;color:#166534}.warn{background:#ffedd5;color:#9a3412}.price{text-align:right}.price strong{font-size:22px}.old{text-decoration:line-through;color:#7a858e;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.secondary{background:#fff;color:#182126;border:1px solid #d7dde2}.listrow{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #e5e9ec}dialog{border:0;border-radius:16px;max-width:520px;width:calc(100% - 30px)}dialog input{width:100%;margin-bottom:10px}textarea{width:100%;min-height:140px}@media(max-width:800px){.grid{grid-template-columns:1fr}.controls{grid-template-columns:1fr 1fr}}@media(max-width:520px){.controls{grid-template-columns:1fr}.deal{grid-template-columns:1fr}.price{text-align:left}}
</style>
</head>
<body>
<header><div class="wrap"><h1>🛒 Croatia Grocery Hunter</h1><div>Lokala matfynd i Pirovac med omnejd</div></div></header>
<main class="wrap">
<div class="toolbar"><button id="add">+ Lägg till fynd</button><button class="secondary" id="export">Exportera</button><button class="secondary" id="import">Importera</button></div>
<div class="card controls"><input id="search" placeholder="Sök produkt eller butik"><select id="category"></select><select id="store"></select><select id="sort"><option value="score">Deal Score</option><option value="discount">Rabatt</option><option value="price">Lägsta pris</option><option value="distance">Närmaste butik</option></select></div>
<div class="grid">
<section class="card"><h2>Dagens fynd</h2><div id="deals"></div></section>
<aside><div class="card"><h2>Inköpslista</h2><div id="cart"></div><p><strong>Totalt: <span id="total">€0.00</span></strong></p><button class="secondary" id="clear">Töm lista</button></div><div class="card"><h2>Butiker</h2><div id="stats"></div></div></aside>
</div></main>
<dialog id="dealDialog"><form method="dialog" id="dealForm"><h2>Lägg till fynd</h2><input name="name" placeholder="Produkt" required><input name="store" placeholder="Butik" required><input name="category" placeholder="Kategori" required><input name="price" type="number" step="0.01" placeholder="Pris €" required><input name="oldPrice" type="number" step="0.01" placeholder="Ordinarie pris €"><input name="distance" type="number" step="0.1" placeholder="Avstånd km"><input name="expires" type="date"><input name="reason" placeholder="Varför fyndet är bra"><div class="toolbar"><button value="cancel" class="secondary">Avbryt</button><button value="default">Spara</button></div></form></dialog>
<dialog id="importDialog"><form method="dialog" id="importForm"><h2>Importera JSON</h2><textarea id="importText"></textarea><div class="toolbar"><button value="cancel" class="secondary">Avbryt</button><button value="default">Importera</button></div></form></dialog>
<script>
const defaultDeals=[{id:"1",name:"Vattenmelon",store:"Studenac",category:"Frukt & grönt",price:0.59,oldPrice:1.09,distance:1.2,expires:"2026-07-29",reason:"Lågt sommarpris nära Pirovac"},{id:"2",name:"Kycklingfilé",store:"Lidl",category:"Kött",price:5.49,oldPrice:8.49,distance:17,expires:"2026-07-30",reason:"Bra kilopris för grill och matlådor"},{id:"3",name:"Ägg 10-pack",store:"Tommy",category:"Mejeri & ägg",price:1.79,oldPrice:2.69,distance:10,expires:"2026-07-30",reason:"Bra pris på vardagsvara"},{id:"4",name:"Blöjor storpack",store:"Kaufland",category:"Barn",price:12.99,oldPrice:19.99,distance:24,expires:"2026-07-31",reason:"Stor besparing om storleken passar"},{id:"5",name:"Tomater 1 kg",store:"Plodine",category:"Frukt & grönt",price:1.29,oldPrice:2.19,distance:18,expires:"2026-07-28",reason:"Tydlig prissänkning"}];
let deals=JSON.parse(localStorage.getItem("cgh_deals")||"null")||defaultDeals;let cart=JSON.parse(localStorage.getItem("cgh_cart")||"[]");const $=s=>document.querySelector(s);const discount=d=>d.oldPrice?Math.round((1-d.price/d.oldPrice)*100):0;const score=d=>Math.max(0,Math.min(100,Math.round(45+discount(d)*0.8+(d.distance<=3?8:d.distance>20?-5:3))));const money=n=>"€"+Number(n||0).toFixed(2);function save(){localStorage.setItem("cgh_deals",JSON.stringify(deals));localStorage.setItem("cgh_cart",JSON.stringify(cart))}function opts(){const cats=[...new Set(deals.map(d=>d.category))],stores=[...new Set(deals.map(d=>d.store))];$("#category").innerHTML='<option value="">Alla kategorier</option>'+cats.map(x=>`<option>${x}</option>`).join("");$("#store").innerHTML='<option value="">Alla butiker</option>'+stores.map(x=>`<option>${x}</option>`).join("")}function render(){const q=$("#search").value.toLowerCase(),cat=$("#category").value,st=$("#store").value,sort=$("#sort").value;let arr=deals.filter(d=>(!q||[d.name,d.store,d.category].join(" ").toLowerCase().includes(q))&&(!cat||d.category===cat)&&(!st||d.store===st));const sorts={score:(a,b)=>score(b)-score(a),discount:(a,b)=>discount(b)-discount(a),price:(a,b)=>a.price-b.price,distance:(a,b)=>(a.distance||0)-(b.distance||0)};arr.sort(sorts[sort]);$("#deals").innerHTML=arr.map(d=>`<div class="deal"><div><h3>${d.name}</h3><div class="muted">${d.store} · ${d.distance||0} km</div><div class="tags"><span class="tag">${d.category}</span><span class="tag good">-${discount(d)}%</span><span class="tag warn">Score ${score(d)}</span></div><div class="muted" style="margin-top:8px">${d.reason||""}</div></div><div class="price"><strong>${money(d.price)}</strong><div class="old">${d.oldPrice?money(d.oldPrice):""}</div><button onclick="addCart('${d.id}')">+ Lista</button></div></div>`).join("")||"<p>Inga fynd matchar filtren.</p>";$("#cart").innerHTML=cart.map(x=>`<div class="listrow"><span>${x.name} × ${x.qty}</span><span>${money(x.price*x.qty)} <button class="secondary" onclick="removeCart('${x.id}')">×</button></span></div>`).join("")||"<p class='muted'>Listan är tom.</p>";$("#total").textContent=money(cart.reduce((s,x)=>s+x.price*x.qty,0));const stats={};deals.forEach(d=>{stats[d.store]=(stats[d.store]||0)+1});$("#stats").innerHTML=Object.entries(stats).map(([k,v])=>`<div class="listrow"><span>${k}</span><strong>${v} fynd</strong></div>`).join("");save()}window.addCart=id=>{const d=deals.find(x=>x.id===id),c=cart.find(x=>x.id===id);c?c.qty++:cart.push({id:d.id,name:d.name,price:d.price,qty:1});render()};window.removeCart=id=>{cart=cart.filter(x=>x.id!==id);render()};["search","category","store","sort"].forEach(id=>$("#"+id).addEventListener(id==="search"?"input":"change",render));$("#clear").onclick=()=>{cart=[];render()};$("#add").onclick=()=>$("#dealDialog").showModal();$("#dealForm").addEventListener("submit",e=>{if(e.submitter.value==="cancel")return;e.preventDefault();const f=new FormData(e.target);deals.unshift({id:String(Date.now()),name:f.get("name"),store:f.get("store"),category:f.get("category"),price:+f.get("price"),oldPrice:+f.get("oldPrice")||null,distance:+f.get("distance")||0,expires:f.get("expires"),reason:f.get("reason")});e.target.reset();$("#dealDialog").close();opts();render()});$("#export").onclick=()=>{const b=new Blob([JSON.stringify(deals,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="croatia-grocery-deals.json";a.click()};$("#import").onclick=()=>$("#importDialog").showModal();$("#importForm").addEventListener("submit",e=>{if(e.submitter.value==="cancel")return;e.preventDefault();try{deals=JSON.parse($("#importText").value);$("#importDialog").close();opts();render()}catch(err){alert("Ogiltig JSON")}});opts();render();
</script>
</body></html>
